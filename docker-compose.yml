services:
  amide:
    build: .
    container_name: amide
    ports:
      # Port on your machine : port inside the container (leave the 8000).
      # Change the host port with AMIDE_PORT in a .env file next to this one.
      - "${AMIDE_PORT:-1707}:8000"
    volumes:
      # The database and all uploaded files live here. Back this folder up.
      - ./data:/data
    restart: unless-stopped
