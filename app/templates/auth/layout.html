<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Amide{% endblock %} · Amide</title>
  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-page {% block page_class %}{% endblock %}">
    <img class="banner" src="{{ banner_url() }}" alt="Amide — every dose, linked">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Amide — every dose, linked.</footer>
  <script src="{{ static_url('js/auth.js') }}" defer></script>
</body>
</html>
