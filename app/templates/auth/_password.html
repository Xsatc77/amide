{# A password input with a show/hide eye button. #}
{% macro password_input(name, id, label, autocomplete) %}
<label class="field" for="{{ id }}">
  <span>{{ label }}</span>
  <span class="password-wrap">
    <input type="password" name="{{ name }}" id="{{ id }}" autocomplete="{{ autocomplete }}" required>
    <button type="button" class="eye" data-eye="{{ id }}" aria-label="Show password" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path class="eye-slash" d="M3 3l18 18" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </span>
</label>
{% endmacro %}
