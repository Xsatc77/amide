name: Security Scan

# Slow scans that do not belong on every push: image vulnerabilities, Dockerfile misconfigurations, a live scan of the running app and
# a secret scan of the whole git history. They run by hand, every Monday, and when a release tag is pushed. No secrets are used.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Builds each image from its Dockerfile (nothing is pushed) and fails on any HIGH or CRITICAL vulnerability that has a fix.
    name: Image Vulnerabilities (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amide
            dockerfile: Dockerfile
          - name: watcher
            dockerfile: Dockerfile.watcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: amide-scan-${{ matrix.name }}:ci
      # The same scan twice: first the full list as a JSON file (kept as an artifact, never fails), then the readable table that fails the job.
      - name: Write The JSON Report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amide-scan-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-${{ matrix.name }}.json
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Fail On Fixable High And Critical Findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: amide-scan-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 30

  config:
    # Misconfiguration check of the Dockerfiles (Trivy reads Dockerfiles; it has no checks for compose files, which the tests cover).
    name: Dockerfile Misconfigurations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Write The JSON Report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-config.json
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Fail On High And Critical Misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-config
          path: trivy-config.json
          if-no-files-found: ignore
          retention-days: 30

  dynamic:
    # Starts the freshly built image with a throwaway volume, signs in with a throwaway account and checks headers and error pages
    # (auth_probe.py, fails on a missing header), then runs the OWASP ZAP baseline scan against it (reports only, never fails).
    name: Running App Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:18000
      # The ZAP image is pinned by digest. To refresh: docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable (the Digest line).
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: amide-scan-amide:ci
      - name: Start The App With A Throwaway Volume
        run: |
          docker volume create amide-scan-data
          docker run -d --name amide-scan -p 18000:8000 -e AMIDE_REGISTRATION=open -v amide-scan-data:/data amide-scan-amide:ci
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL/healthz" >/dev/null 2>&1; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the app never answered /healthz"; docker logs amide-scan; exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Signed-In Header And Error Page Probe
        run: python .github/zap/auth_probe.py "$APP_URL"
      - name: ZAP Baseline Scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          # -I: warnings do not fail the step; --network host lets the scanner reach the published port.
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$APP_URL" -J zap-report.json -r zap-report.html -I || echo "ZAP exited with a non-zero status (reports are still kept)"
      - name: Print The ZAP Alert Summary
        if: always()
        run: python .github/zap/zap_summary.py zap-out/zap-report.json
      - name: App Log
        if: always()
        run: docker logs amide-scan 2>&1 | tail -n 100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    # gitleaks over every commit, from its official container image pinned by digest (v8.30.1).
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan The Full History
        run: |
          mkdir -p gitleaks-out && chmod 777 gitleaks-out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/gitleaks-out:/out" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /out/gitleaks.json --exit-code 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-out/
          if-no-files-found: ignore
          retention-days: 30
