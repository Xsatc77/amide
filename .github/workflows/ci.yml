name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-watcher.txt
      # OpenCV (used by the OCR for scanned price lists) needs these on a bare runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt -r requirements-watcher.txt
      - run: python -m pytest -q -p no:warnings

  docker:
    # Builds the image on every push (so a broken Dockerfile is caught) and publishes it only for a version tag.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Build once into the local daemon and run the OCR on a generated test picture inside the slim image, so a missing system library fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amide-ci
          cache-from: type=gha,scope=amide
          cache-to: type=gha,mode=max,scope=amide
      - run: docker run --rm -i amide-ci python - < .github/ocr_smoke.py
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amide
      # The watcher image: build it on every push, prove it starts and reads its environment (status never contacts Telegram), publish on a tag.
      - id: meta_watcher
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-watcher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.watcher
          load: true
          tags: amide-watcher-ci
          cache-from: type=gha,scope=watcher
          cache-to: type=gha,mode=max,scope=watcher
      - run: >
          docker run --rm -e AMIDE_URL=http://127.0.0.1:9 -e AMIDE_TOKEN=ci -e TELEGRAM_API_ID=1 -e TELEGRAM_API_HASH=ci
          amide-watcher-ci python -m watcher status | tee status.txt && grep -q "session: missing" status.txt
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.watcher
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta_watcher.outputs.tags }}
          labels: ${{ steps.meta_watcher.outputs.labels }}
          cache-from: type=gha,scope=watcher
